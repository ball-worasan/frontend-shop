# Used only by ci/scan_image_layers.py. Keeps the default ruleset and allows one
# known false positive from the pinned node base image (a C++ constant name, not a secret).
[extend]
useDefault = true

[[allowlists]]
description = "node base image V8 header: kApiTaggedSize constant flagged as generic-api-key"
targetRules = ["generic-api-key"]
paths = ['''(^|/)usr/local/include/node/v8-internal\.h$''']

[[allowlists]]
description = "Next.js build output: random per-build preview/server-action keys generated by `next build`, not external credentials"
targetRules = ["generic-api-key"]
paths = [
  '''(^|/)app/\.next/prerender-manifest\.json$''',
  '''(^|/)app/\.next/server/preview-props\.json$''',
  '''(^|/)app/\.next/server/server-reference-manifest\.json$''',
]
